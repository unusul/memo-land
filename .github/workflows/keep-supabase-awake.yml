# A free Supabase project pauses after a week without use: one read a day through the Data API keeps it awake.
# Uses the same secrets as the Pages workflow. GitHub suspends scheduled workflows after 60 days without commits in
# the repo, and says so by email: re-enable it from the Actions tab.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row of public_domains
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$SUPABASE_URL/rest/v1/public_domains?select=domain&limit=1" -H "apikey: $SUPABASE_KEY")
          echo "Supabase answered HTTP $code"
          test "$code" = 200
