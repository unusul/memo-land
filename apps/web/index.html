<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1e28" media="(prefers-color-scheme: dark)" />
    <!-- Preview only: the fonts are to be shipped with the app before release, so it opens offline and calls no third party. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&display=swap" />
    <title>memo-land</title>
    <!-- The theme chosen in the settings, applied before the first paint (see src/settings/theme.ts). -->
    <script>
      try {
        var t = localStorage.getItem('attivita:theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t;
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = t === 'dark' ? '#1b1e28' : '#ffffff'; });
        }
      } catch (e) { /* storage unavailable: the system theme */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
